name: cycle

# CryptoYar Free — full cycle every 15 minutes + GitHub Pages dashboard.
# Free forever on public repos. Runs OUTSIDE Iran (GitHub runners) → Binance works.

on:
  schedule:
    # Off-peak minutes (:07 :23 :38 :53) — GitHub's cron cluster is heavily
    # congested on :00/:15/:30/:45 and drops runs there (documented platform
    # behaviour). Irregular minutes are far more reliable. Still ~every 15 min.
    - cron: '7,23,38,53 * * * *'
  workflow_dispatch: {} # manual run button

permissions:
  contents: write # commit the SQLite DB back
  pages: write # publish the dashboard
  id-token: write

concurrency:
  group: cryptoyar-cycle
  cancel-in-progress: false # queue runs — never parallel (DB safety)

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: file:../db/custom.db # relative to prisma/schema.prisma → <repo>/db/custom.db
      CMC_API_KEY: ${{ secrets.CMC_API_KEY }} # optional — without it the system falls back to Binance ranking
      TRADING_MODE: paper
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps + prisma generate
        run: bun install
      - name: Create DB tables
        run: mkdir -p db && bunx prisma db push --accept-data-loss --skip-generate
      - name: Run one full cycle (candles, radar, fund, brain, prune)
        run: bun scripts/gh-cycle.ts
      - name: Build dashboard (site/)
        run: bun scripts/gh-report.ts
      - name: Commit database back to repo
        run: |
          git config user.name "cryptoyar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/custom.db
          git diff --cached --quiet || (git commit -m "data: cycle $(date -u +%FT%TZ)" && git push)
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: cycle
    runs-on: ubuntu-latest
    steps:
      - name: Deploy dashboard to GitHub Pages
        uses: actions/deploy-pages@v4
